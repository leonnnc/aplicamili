<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Intro A · Espuma — Lavandería Mili</title>
<style>
  :root {
    --navy-900: #060f1f;
    --navy-800: #0a1a33;
    --navy-700: #0e2647;
    --blue-500: #2563c9;
    --blue-400: #4c8dff;
    --blue-300: #7fb4ff;
    --ice-100: #dce9ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #060f1f;
    color: var(--ice-100);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  .intro {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(circle at 50% 44%, #123a6b 0%, #0a1a33 46%, #060f1f 100%);
    transition: opacity .5s ease, visibility .5s ease;
  }
  .intro.is-out { opacity: 0; visibility: hidden; }

  /* ---- anillos de espuma ---- */
  .anillo {
    position: absolute;
    width: min(78vw, 560px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid rgba(127, 180, 255, .38);
    opacity: 0;
    animation: anillo 2.8s cubic-bezier(.22, .61, .36, 1) forwards;
  }
  .anillo:nth-child(2) { animation-delay: .22s; border-color: rgba(127, 180, 255, .26); }
  .anillo:nth-child(3) { animation-delay: .44s; border-color: rgba(127, 180, 255, .16); }
  @keyframes anillo {
    0%   { transform: scale(.18); opacity: 0; }
    18%  { opacity: .85; }
    100% { transform: scale(1.45); opacity: 0; }
  }

  /* ---- burbujas ---- */
  .burbuja {
    position: absolute;
    bottom: -30px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, rgba(255, 255, 255, .55), rgba(127, 180, 255, .06) 62%, transparent 70%);
    opacity: 0;
    animation: burbuja 3s ease-in forwards;
  }
  @keyframes burbuja {
    0%   { transform: translateY(0) scale(.7); opacity: 0; }
    25%  { opacity: .55; }
    100% { transform: translateY(-72vh) scale(1.1); opacity: 0; }
  }

  /* ---- centro ---- */
  .centro {
    position: relative;
    display: grid;
    justify-items: center;
    gap: 12px;
    text-align: center;
    padding: 0 24px;
  }

  .marca {
    display: grid;
    place-items: center;
    width: 68px;
    height: 68px;
    border-radius: 20px;
    color: #eaf2ff;
    border: 1px solid rgba(127, 180, 255, .5);
    background: rgba(37, 99, 201, .22);
    box-shadow: 0 0 42px rgba(76, 141, 255, .35), inset 0 0 24px rgba(76, 141, 255, .18);
    animation: marca .9s .3s cubic-bezier(.2, .8, .2, 1) both;
  }
  .marca svg { width: 32px; height: 32px; }
  @keyframes marca {
    from { opacity: 0; transform: scale(.72); filter: blur(6px); }
    to   { opacity: 1; transform: scale(1); filter: blur(0); }
  }

  .titulo {
    margin: 4px 0 0;
    font-size: clamp(28px, 6.4vw, 50px);
    font-weight: 800;
    letter-spacing: -.025em;
    line-height: 1.04;
    color: #eef4ff;
    animation: sube .9s .62s cubic-bezier(.2, .8, .2, 1) both;
  }
  .titulo em { font-style: normal; color: var(--blue-300); position: relative; }
  .titulo em::after {
    content: "";
    position: absolute;
    left: 2px; right: 2px; bottom: -.1em;
    height: 2px;
    background: linear-gradient(90deg, rgba(76, 141, 255, 0), #4c8dff 40%, rgba(76, 141, 255, 0));
    transform: scaleX(0);
    animation: subraya .7s 1.55s ease-out forwards;
  }
  @keyframes subraya { to { transform: scaleX(1); } }

  .sub {
    margin: 0;
    font-size: clamp(10px, 2.3vw, 12px);
    letter-spacing: .34em;
    text-transform: uppercase;
    color: rgba(180, 205, 255, .62);
    animation: sube .9s .82s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes sube {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  .pie {
    position: absolute;
    bottom: max(20px, env(safe-area-inset-bottom));
    margin: 0;
    font-size: 10px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: rgba(160, 190, 240, .4);
    animation: sube 1s 1.4s both;
  }

  /* ---- controles del prototipo ---- */
  .barra {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 7px 9px 7px 14px;
    border-radius: 999px;
    border: 1px solid rgba(127, 180, 255, .28);
    background: rgba(6, 15, 31, .82);
    backdrop-filter: blur(8px);
    font-size: 11.5px;
    color: rgba(220, 233, 255, .8);
    z-index: 10;
  }
  .barra b { font-weight: 700; color: #fff; letter-spacing: .06em; }
  .barra button {
    font: inherit;
    font-weight: 600;
    color: #061024;
    background: var(--blue-300);
    border: 0;
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .barra button:hover { background: #a8ccff; }
  .tiempo { font-variant-numeric: tabular-nums; min-width: 46px; text-align: right; }

  @media (prefers-reduced-motion: reduce) {
    .anillo, .burbuja, .marca, .titulo, .sub, .titulo em::after { animation: none; }
    .anillo, .burbuja { display: none; }
    .titulo em::after { transform: scaleX(1); }
  }
</style>
</head>
<body>

<div class="intro" id="intro">
  <div class="anillo"></div>
  <div class="anillo"></div>
  <div class="anillo"></div>

  <div class="burbuja" style="left:18%; width:14px; height:14px; animation-delay:.5s"></div>
  <div class="burbuja" style="left:29%; width:8px; height:8px; animation-delay:1.1s"></div>
  <div class="burbuja" style="left:63%; width:11px; height:11px; animation-delay:.8s"></div>
  <div class="burbuja" style="left:74%; width:17px; height:17px; animation-delay:1.4s"></div>
  <div class="burbuja" style="left:47%; width:6px; height:6px; animation-delay:1.9s"></div>

  <div class="centro">
    <span class="marca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="3.5" y="2.5" width="17" height="19" rx="3" />
        <circle cx="12" cy="14" r="4.2" />
        <path d="M7 6.2h.01M10 6.2h.01" />
      </svg>
    </span>
    <h1 class="titulo">Lavandería <em>Mili</em></h1>
    <p class="sub">Control de servicios</p>
  </div>

  <p class="pie">Lavandería &amp; tintorería</p>
</div>

<div class="barra">
  <b>A · Espuma</b>
  <span class="tiempo" id="tiempo">0.0 s</span>
  <button type="button" id="repetir">Repetir</button>
</div>

<script>
  (function () {
    const intro = document.getElementById('intro');
    const tiempo = document.getElementById('tiempo');
    const DURACION = 3000;

    let inicio = 0;
    let temporizador = null;
    let salida = null;
    let reloj = null;

    function limpiar() {
      clearTimeout(temporizador);
      clearTimeout(salida);
      clearInterval(reloj);
    }

    function salir() {
      limpiar();
      intro.classList.add('is-out');
      salida = setTimeout(() => { intro.classList.remove('is-out'); intro.style.visibility = 'hidden'; }, 500);
    }

    function arrancar() {
      limpiar();
      intro.style.visibility = 'visible';
      intro.classList.remove('is-out');
      // reinicia las animaciones CSS
      intro.classList.add('reinicio');
      void intro.offsetWidth;
      intro.classList.remove('reinicio');

      inicio = performance.now();
      tiempo.textContent = '0.0 s';
      reloj = setInterval(() => {
        const t = Math.min(DURACION, performance.now() - inicio) / 1000;
        tiempo.textContent = t.toFixed(1) + ' s';
      }, 100);

      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        temporizador = setTimeout(salir, DURACION);
      }
    }

    document.getElementById('repetir').addEventListener('click', (e) => {
      e.stopPropagation();
      // recarga solo el nodo para que las animaciones vuelvan a correr
      location.reload();
    });

    intro.addEventListener('click', salir);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') salir(); });
    window.addEventListener('load', arrancar);
  })();
</script>
</body>
</html>
