<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Intro F · Foto de agua — Lavandería Mili</title>
<style>
  :root {
    --tinta: #0b3350;
    --tinta-suave: #3a6c8c;
    --papel: #ffffff;
    --agua-alta: #bedeee;
    --agua-baja: #a9d2e6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--papel);
    color: var(--tinta);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  .intro {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--papel);
    transition: opacity .5s ease, visibility .5s ease;
  }
  .intro.is-out { opacity: 0; visibility: hidden; }

  /* ---------------- contenido ---------------- */
  .centro {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 12px;
    text-align: center;
    padding: 0 24px;
    opacity: 0;
    transform: translateY(14px);
    /* aparece cuando el agua ya llenó: así la cresta no cruza el nombre */
    animation: aparece .8s 1.25s cubic-bezier(.2, .8, .2, 1) forwards;
  }
  @keyframes aparece { to { opacity: 1; transform: none; } }

  .marca {
    display: grid;
    place-items: center;
    width: 72px;
    height: 72px;
    border-radius: 22px;
    color: #ffffff;
    background: linear-gradient(160deg, #1c6ba8, #0b3350);
    box-shadow: 0 14px 34px rgba(11, 51, 80, .22);
  }
  .marca svg { width: 34px; height: 34px; }
  .titulo {
    margin: 4px 0 0;
    font-size: clamp(28px, 6.4vw, 50px);
    font-weight: 800;
    letter-spacing: -.025em;
    line-height: 1.04;
    color: var(--tinta);
  }
  .titulo em { font-style: normal; color: #1c6ba8; }
  .sub {
    margin: 0;
    font-size: clamp(10px, 2.3vw, 12px);
    letter-spacing: .34em;
    text-transform: uppercase;
    color: var(--tinta-suave);
  }

  /* ---------------- el agua: la foto, subiendo ---------------- */
  .agua {
    position: absolute;
    inset: 0;
    z-index: 2;
    transform: translateY(104%);
    animation: llena 1.2s .08s cubic-bezier(.4, 0, .2, 1) forwards;
    will-change: transform;
  }
  @keyframes llena {
    from { transform: translateY(104%); }
    to   { transform: translateY(0); }
  }

  /* franja con la cresta de la foto */
  .foto {
    position: absolute;
    z-index: 2;
    top: 0;
    left: 0;
    right: 0;
    height: 92vh;
    background-image: url("agua.webp");
    background-repeat: no-repeat;
    background-size: 100% auto;
    background-position: center top;
    animation: deriva 14s ease-in-out infinite alternate;
  }

  /* funde el borde inferior de la foto con el cuerpo del agua */
  .empalme {
    position: absolute;
    z-index: 3;
    left: 0;
    right: 0;
    top: 32vh;
    height: 60vh;
    background: linear-gradient(180deg, rgba(190, 222, 238, 0) 0%, rgba(190, 222, 238, .8) 60%, #bedeee 100%);
  }
  @keyframes deriva {
    from { background-position: center top; }
    to   { background-position: 6% top; }
  }

  /* cuerpo del agua, mismo azul que la base de la foto */
  .cuerpo {
    position: absolute;
    z-index: 1;
    left: 0;
    right: 0;
    top: clamp(120px, 30vh, 300px);
    bottom: 0;
    background:
      linear-gradient(180deg, #bedeee 0%, #b3d9ec 55%, #9cc9e0 100%);
  }

  /* burbujas sueltas que suben despacio */
  .b {
    position: absolute;
    z-index: 3;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, .95), rgba(120, 180, 215, .18) 60%, transparent 72%);
    box-shadow: inset -1px -1px 3px rgba(255, 255, 255, .8);
    opacity: 0;
    animation: sube var(--dur, 5s) var(--delay, 0s) ease-in-out infinite;
  }
  @keyframes sube {
    0%   { transform: translateY(20px) scale(.8); opacity: 0; }
    25%  { opacity: .75; }
    80%  { opacity: .5; }
    100% { transform: translateY(-140px) scale(1.1); opacity: 0; }
  }

  /* destello de luz al completar */
  .destello {
    position: absolute;
    inset: 0;
    z-index: 4;
    background: radial-gradient(circle at 50% 38%, rgba(255, 255, 255, .75), transparent 55%);
    opacity: 0;
    animation: destello .8s 1.25s ease-out forwards;
    pointer-events: none;
  }
  @keyframes destello {
    0%   { opacity: 0; transform: scale(.9); }
    35%  { opacity: 1; }
    100% { opacity: 0; transform: scale(1.2); }
  }

  .pie {
    position: absolute;
    bottom: max(20px, env(safe-area-inset-bottom));
    left: 0; right: 0;
    margin: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: rgba(11, 51, 80, .45);
    z-index: 5;
  }

  /* ---------------- controles ---------------- */
  .barra {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 7px 9px 7px 14px;
    border-radius: 999px;
    border: 1px solid rgba(11, 51, 80, .16);
    background: rgba(247, 252, 254, .9);
    backdrop-filter: blur(8px);
    font-size: 11.5px;
    color: rgba(11, 51, 80, .8);
    z-index: 20;
  }
  .barra b { font-weight: 700; color: var(--tinta); letter-spacing: .06em; }
  .barra button {
    font: inherit; font-weight: 600; color: #fff;
    background: #1c6ba8; border: 0; border-radius: 999px;
    padding: 6px 12px; cursor: pointer;
  }
  .barra button:hover { background: #17578a; }
  .tiempo { font-variant-numeric: tabular-nums; min-width: 46px; text-align: right; }

  @media (prefers-reduced-motion: reduce) {
    .agua, .foto, .centro, .destello, .b { animation: none; }
    .agua { transform: none; }
    .centro { opacity: 1; transform: none; }
    .b { display: none; }
  }
</style>
</head>
<body>

<div class="intro" id="intro">
  <div class="agua">
    <div class="foto"></div>
    <div class="cuerpo"></div>
    <div class="empalme"></div>
    <span class="b" style="left:18%; bottom:34%; width:8px; height:8px; --dur:5.5s; --delay:.6s"></span>
    <span class="b" style="left:64%; bottom:22%; width:5px; height:5px; --dur:6.5s; --delay:1.4s"></span>
    <span class="b" style="left:82%; bottom:40%; width:11px; height:11px; --dur:7s; --delay:.2s"></span>
    <span class="b" style="left:37%; bottom:16%; width:6px; height:6px; --dur:5s; --delay:2s"></span>
  </div>

  <div class="centro">
    <span class="marca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="3.5" y="2.5" width="17" height="19" rx="3" />
        <circle cx="12" cy="14" r="4.2" />
        <path d="M7 6.2h.01M10 6.2h.01" />
      </svg>
    </span>
    <h1 class="titulo">Lavandería <em>Mili</em></h1>
    <p class="sub">Control de servicios</p>
  </div>

  <div class="destello"></div>
  <p class="pie">Lavandería &amp; tintorería</p>
</div>

<div class="barra">
  <b>F · Foto de agua</b>
  <span class="tiempo" id="tiempo">0.0 s</span>
  <button type="button" id="repetir">Repetir</button>
</div>

<script>
  (function () {
    const intro = document.getElementById('intro');
    const tiempo = document.getElementById('tiempo');
    const DURACION = 3000;
    let inicio = 0, temporizador = null, reloj = null;

    function salir() {
      clearTimeout(temporizador);
      clearInterval(reloj);
      intro.classList.add('is-out');
    }
    function arrancar() {
      inicio = performance.now();
      reloj = setInterval(() => {
        const t = Math.min(DURACION, performance.now() - inicio) / 1000;
        tiempo.textContent = t.toFixed(1) + ' s';
      }, 100);
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        temporizador = setTimeout(salir, DURACION);
      }
    }

    document.getElementById('repetir').addEventListener('click', (e) => { e.stopPropagation(); location.reload(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') salir(); });
    window.addEventListener('load', arrancar);
  })();
</script>
</body>
</html>
