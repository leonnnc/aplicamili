<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Intro B · Agua — Lavandería Mili</title>
<style>
  :root {
    --navy-900: #05101f;
    --navy-800: #071528;
    --navy-700: #0b2544;
    --blue-600: #1b4e8f;
    --blue-500: #2563c9;
    --blue-400: #4c8dff;
    --blue-300: #7fb4ff;
    --ice-100: #dce9ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #05101f;
    color: var(--ice-100);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  .intro {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: linear-gradient(180deg, #061020 0%, #0b2544 58%, #050e1b 100%);
    transition: opacity .5s ease, visibility .5s ease;
  }
  .intro.is-out { opacity: 0; visibility: hidden; }

  /* ---- línea de agua ---- */
  .agua {
    position: absolute;
    left: 0; right: 0;
    top: 64%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(127, 180, 255, .75), transparent);
    box-shadow: 0 0 26px rgba(76, 141, 255, .45);
    opacity: 0;
    animation: agua 2.6s .1s ease-out forwards;
  }
  @keyframes agua {
    0%   { opacity: 0; transform: scaleX(.2); }
    30%  { opacity: 1; transform: scaleX(1); }
    100% { opacity: .35; transform: scaleX(1); }
  }

  /* ---- reflejo que barre ---- */
  .barrido {
    position: absolute;
    top: 50%;
    left: -18%;
    width: 210px;
    height: 46vh;
    margin-top: -23vh;
    border-radius: 50%;
    background: linear-gradient(100deg, transparent 0%, rgba(127, 180, 255, .22) 44%, rgba(220, 233, 255, .34) 50%, rgba(127, 180, 255, .22) 56%, transparent 100%);
    filter: blur(26px);
    transform: skewX(-12deg);
    animation: barrido 1.4s .9s cubic-bezier(.4, 0, .2, 1) both;
  }
  @keyframes barrido {
    from { transform: translateX(0) skewX(-12deg); opacity: 0; }
    20%  { opacity: .95; }
    to   { transform: translateX(520%) skewX(-12deg); opacity: 0; }
  }

  /* ---- ondas ---- */
  .onda {
    position: absolute;
    left: 50%;
    top: 64%;
    width: 80px;
    height: 14px;
    margin-left: -40px;
    border-radius: 50%;
    border: 1px solid rgba(127, 180, 255, .5);
    opacity: 0;
    animation: onda 2s 1.5s ease-out forwards;
  }
  .onda:nth-of-type(2) { animation-delay: 1.75s; }
  @keyframes onda {
    0%   { transform: scale(.4); opacity: 0; }
    20%  { opacity: .8; }
    100% { transform: scale(6.5); opacity: 0; }
  }

  .centro {
    position: relative;
    display: grid;
    justify-items: center;
    gap: 12px;
    text-align: center;
    padding: 0 24px;
    z-index: 2;
  }

  /* ---- marca que se llena de agua ---- */
  .marca {
    position: relative;
    display: grid;
    place-items: center;
    width: 74px;
    height: 74px;
    border-radius: 22px;
    overflow: hidden;
    color: #eaf2ff;
    border: 1px solid rgba(127, 180, 255, .5);
    background: rgba(11, 37, 68, .85);
    animation: marca .8s .25s cubic-bezier(.2, .8, .2, 1) both;
  }
  .marca svg { width: 34px; height: 34px; position: relative; z-index: 2; }
  .marca .nivel {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 0;
    background: linear-gradient(180deg, rgba(76, 141, 255, .85), rgba(37, 99, 201, .95));
    animation: nivel 1.15s .55s cubic-bezier(.4, 0, .2, 1) forwards;
  }
  .marca .nivel::after {
    content: "";
    position: absolute;
    left: -10%; right: -10%; top: -4px;
    height: 8px;
    border-radius: 50%;
    background: rgba(168, 204, 255, .55);
    filter: blur(1px);
  }
  @keyframes nivel { from { height: 0; } to { height: 100%; } }
  @keyframes marca {
    from { opacity: 0; transform: translateY(10px) scale(.94); }
    to   { opacity: 1; transform: none; }
  }

  .titulo {
    margin: 4px 0 0;
    font-size: clamp(28px, 6.4vw, 50px);
    font-weight: 800;
    letter-spacing: -.025em;
    line-height: 1.04;
    color: #eef4ff;
    /* barrido de izquierda a derecha */
    clip-path: inset(0 100% 0 0);
    animation: revela 1s 1.05s cubic-bezier(.65, 0, .35, 1) forwards;
  }
  .titulo em { font-style: normal; color: var(--blue-300); }
  @keyframes revela { to { clip-path: inset(0 0 0 0); } }

  .sub {
    margin: 0;
    font-size: clamp(10px, 2.3vw, 12px);
    letter-spacing: .34em;
    text-transform: uppercase;
    color: rgba(180, 205, 255, .6);
    opacity: 0;
    animation: aparece .8s 1.6s both;
  }
  @keyframes aparece { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .pie {
    position: absolute;
    bottom: max(20px, env(safe-area-inset-bottom));
    margin: 0;
    font-size: 10px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: rgba(160, 190, 240, .4);
    animation: aparece 1s 1.9s both;
  }

  /* ---- controles ---- */
  .barra {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 7px 9px 7px 14px;
    border-radius: 999px;
    border: 1px solid rgba(127, 180, 255, .28);
    background: rgba(5, 16, 31, .82);
    backdrop-filter: blur(8px);
    font-size: 11.5px;
    color: rgba(220, 233, 255, .8);
    z-index: 10;
  }
  .barra b { font-weight: 700; color: #fff; letter-spacing: .06em; }
  .barra button {
    font: inherit; font-weight: 600; color: #061024;
    background: var(--blue-300); border: 0; border-radius: 999px;
    padding: 6px 12px; cursor: pointer;
  }
  .barra button:hover { background: #a8ccff; }
  .tiempo { font-variant-numeric: tabular-nums; min-width: 46px; text-align: right; }

  @media (prefers-reduced-motion: reduce) {
    .agua, .barrido, .onda, .marca, .titulo, .sub, .marca .nivel { animation: none; }
    .titulo { clip-path: none; }
    .marca .nivel { height: 100%; }
    .agua, .barrido, .onda { display: none; }
  }
</style>
</head>
<body>

<div class="intro" id="intro">
  <div class="agua"></div>
  <div class="barrido"></div>
  <div class="onda"></div>
  <div class="onda"></div>

  <div class="centro">
    <span class="marca">
      <span class="nivel"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="3.5" y="2.5" width="17" height="19" rx="3" />
        <circle cx="12" cy="14" r="4.2" />
        <path d="M7 6.2h.01M10 6.2h.01" />
      </svg>
    </span>
    <h1 class="titulo">Lavandería <em>Mili</em></h1>
    <p class="sub">Control de servicios</p>
  </div>

  <p class="pie">Lavandería &amp; tintorería</p>
</div>

<div class="barra">
  <b>B · Agua</b>
  <span class="tiempo" id="tiempo">0.0 s</span>
  <button type="button" id="repetir">Repetir</button>
</div>

<script>
  (function () {
    const intro = document.getElementById('intro');
    const tiempo = document.getElementById('tiempo');
    const DURACION = 3000;
    let inicio = 0;
    let temporizador = null;
    let reloj = null;

    function salir() {
      clearTimeout(temporizador);
      clearInterval(reloj);
      intro.classList.add('is-out');
    }

    function arrancar() {
      inicio = performance.now();
      reloj = setInterval(() => {
        const t = Math.min(DURACION, performance.now() - inicio) / 1000;
        tiempo.textContent = t.toFixed(1) + ' s';
      }, 100);
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        temporizador = setTimeout(salir, DURACION);
      }
    }

    document.getElementById('repetir').addEventListener('click', (e) => { e.stopPropagation(); location.reload(); });
    intro.addEventListener('click', salir);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') salir(); });
    window.addEventListener('load', arrancar);
  })();
</script>
</body>
</html>
